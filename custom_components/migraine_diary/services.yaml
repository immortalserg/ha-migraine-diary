record_medication:
  name: Record medication
  description: Record medication taken
  fields:
    profile_id:
      name: Profile ID
      description: Diary profile identifier
      required: true
      example: "patient"
      selector:
        text:
    name:
      name: Medication name
      description: Name of medication
      required: true
      selector:
        text:
    dose:
      name: Dose
      description: Medication dose
      selector:
        number:
          min: 0
          max: 100000
          step: any
    unit:
      name: Unit
      description: Dose unit
      selector:
        text:

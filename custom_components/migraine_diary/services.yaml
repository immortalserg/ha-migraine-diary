        text:
record_pain:
  name: Record pain
  description: Record pain intensity, locations and symptoms
  fields:
    profile_id:
      name: Profile ID
      description: Diary profile identifier
      required: true
      example: "patient"
      selector:
        text:
    intensity:
      name: Pain intensity
      description: Pain level from 1 to 9
      required: true
      selector:
        number:
          min: 1
          max: 9
          step: 1
    zones:
      name: Pain zones
      description: Zone numbers from 1 to 19
      required: true
      selector:
        object:
    symptoms:
      name: Symptoms
      description: Symptom list
      selector:
        object:
    episode_id:
      name: Episode ID
      description: Episode identifier
      selector:
        text:
    occurred_at:
      name: Event time
      description: ISO 8601 timestamp
      selector:
        text:

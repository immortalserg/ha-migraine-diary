name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python modules
        run: python -m compileall -q custom_components/migraine_diary tests
      - name: SQLite regression tests
        run: python -m unittest discover -s tests -v

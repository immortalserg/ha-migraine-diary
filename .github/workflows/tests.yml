name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python modules
        run: python -m compileall -q custom_components/migraine_diary tests
      - name: Validate integration JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [Path('hacs.json'), *Path('custom_components/migraine_diary').rglob('*.json')]
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK: {path}')
          PY
      - name: Validate Lovelace card JavaScript syntax
        run: node --check frontend/migraine-diary-card.js
      - name: SQLite regression tests
        run: python -m unittest discover -s tests -v
